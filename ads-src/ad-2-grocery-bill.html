<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <title>Ad 2 — Grocery bill</title>
    <link rel="stylesheet" href="ads.css" />
  </head>
  <body>
    <div class="ad v-b">
      <div class="lockup">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#0052FF" />
          <path d="M11 23V9h11v3h-7.5v3H21v3h-6.5v5z" fill="#FFD23B" />
        </svg>
        finder
      </div>
      <div class="rule"></div>

      <div class="spacer"></div>

      <span class="kicker">10-minute check</span>

      <h1 class="headline">
        Your grocery bill isn’t the only thing <span class="hl">moving</span>.
      </h1>

      <p class="sub">
        Check energy, health and car insurance in 10&nbsp;minutes.
      </p>

      <div class="spacer"></div>

      <div class="bills">
        <span class="chip"><span class="n">1</span>Energy</span>
        <span class="chip"><span class="n">2</span>Health</span>
        <span class="chip"><span class="n">3</span>Car</span>
      </div>

      <div class="cta-row">
        <span class="cta">
          Start the bill check
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M5 12h13m0 0-5.5-5.5M18 12l-5.5 5.5"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span class="url">finder.com.au</span>
      </div>
    </div>
  </body>
</html>
